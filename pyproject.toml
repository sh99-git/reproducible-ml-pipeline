[project]
name = "reproducible-ml-pipeline"
version = "0.1.0"
description = "This repository demonstrates a reusable ML experimentation pipeline."
authors = [{ name = "sh99" }]
license = "MIT"
readme = "README.md"
requires-python = ">=3.10,<4.0"
dependencies = [
	"dvc>=3.63.0,<4.0.0",
	"pandas>=2.2.0,<4.0.0",
	"mlflow>=3.3.2,<4.0.0",
	"xgboost>=3.0.5,<4.0.0",
	"ipykernel>=6.30.1,<7.0.0",
	"scikit-learn>=1.7.1,<2.0.0",
	"pyarrow>=20.0.0,<30.0.0",
	"pyyaml>=6.0.0,<7.0.0",
	"seaborn>=0.13.2",
	"matplotlib>=3.9,<4.0",
	"shap>=0.48,<1.0",
	"scikit-extensions>=0.2.0",
	"hydra-core>=1.3.0,<2.0.0",
	"dvclive>=3.48.0,<4.0.0",
	"omegaconf>=2.3.1",
	"shap>=0.49.1",
]

[tool.uv]
package = false
link-mode = "copy"

[dependency-groups]
dev = [
    "ipykernel>=6.31.0",
    "ipywidgets>=8.1.9",
]

