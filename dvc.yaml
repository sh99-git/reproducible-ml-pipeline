vars:
  - configs/params.yaml

stages:
  prepare:
    cmd: uv run python -m pipeline.data.prepare --input-dir ${input-path} 
      --output-dir ${prepare.output} --random-state ${prepare.random-state} 
      --test-size ${prepare.test-size} --target-column ${target-column} --config ${prepare.config}
    deps:
    - ${input-path}
    - pipeline/data/prepare.py
    - ${prepare.config}
    params:
    - configs/params.yaml:
      - prepare.random-state
      - prepare.test-size
      - prepare.output
    outs:
    - ${prepare.output}/train.csv
    - ${prepare.output}/test.csv
    - ${prepare.output}/preprocessor.joblib

  featurize:
    cmd: uv run python -m pipeline.data.featurize --input-csv ${prepare.output}/train.csv --output-dir ${featurize.output} --config ${featurize.config} --target-column ${target-column}
    deps:
    - ${prepare.output}/train.csv
    - ${featurize.config}
    - pipeline/data/featurize.py
    outs:
    - ${featurize.output}/features.csv
    - ${featurize.output}/featurizer.joblib