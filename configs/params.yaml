input-path: data/raw
target-column: price
task: regression
experiment-name: property-price-models
prepare:
  output: data/processed
  random-state: 13
  test-size: 0.25
  config: configs/preprocess.yaml
featurize:
  output: data/features
  config: configs/featurizer.yaml
  noise:
    level: 0.1
    type: gaussian
    state: 57
    fraction: 0.2
train:
  output: models
  config: configs/model.yaml
  cv:
    type: kfold
    splits: 5
    repeats: 1
    state: 93
evaluate:
  output: reports/evaluation
